<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SDV_Replica_POC internal software stack</title>
<desc>Two zonal control units run different RTOSes: ZCU-1 runs FreeRTOS, ZCU-2 runs Zephyr RTOS. Both connect down to two HPCs. HPC-1, a Raspberry Pi 5, runs the Xen hypervisor (the final choice over Jailhouse) with a Dom0 Linux control partition and a QNX DomU guest. HPC-2, a BeagleBone Black, has no hypervisor and no RTOS, running Yocto Linux directly with Docker containers. HPC-1 connects to AWS and HPC-2 connects to Azure.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#4a4a45" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="480" fill="#ffffff"/>

<text x="30" y="30" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#141412">SDV_Replica_POC - internal software stack</text>
<text x="30" y="48" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6a6a63">RTOS + hypervisor decisions finalized 2026-08-30 (v0.6.0)</text>

<!-- legend -->
<rect x="430" y="18" width="14" height="14" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="448" y="29" font-family="Arial" font-size="10" fill="#4a4a45">Board / container (structural)</text>
<rect x="430" y="36" width="14" height="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="448" y="47" font-family="Arial" font-size="10" fill="#4a4a45">OS / hypervisor / RTOS</text>
<rect x="430" y="54" width="14" height="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="448" y="65" font-family="Arial" font-size="10" fill="#4a4a45">Cloud</text>

<!-- connectors -->
<line x1="180" y1="146" x2="180" y2="190" stroke="#4a4a45" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="146" x2="500" y2="190" stroke="#4a4a45" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="180" y1="350" x2="180" y2="390" stroke="#4a4a45" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="350" x2="500" y2="390" stroke="#4a4a45" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="320" y1="268" x2="360" y2="268" stroke="#4a4a45" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="360" y1="274" x2="320" y2="274" stroke="#4a4a45" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="258" font-family="Arial" font-size="9" fill="#8a8a84" text-anchor="middle">Ethernet</text>

<!-- ZCU-1 -->
<rect x="55" y="90" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="180" y="110" font-family="Arial" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">ZCU-1 - STM32 Discovery</text>
<text x="180" y="128" font-family="Arial" font-size="11" fill="#5F5E5A" text-anchor="middle">Embedded C, FreeRTOS</text>

<!-- ZCU-2 -->
<rect x="375" y="90" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="500" y="110" font-family="Arial" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">ZCU-2 - STM32 Nucleo</text>
<text x="500" y="128" font-family="Arial" font-size="11" fill="#5F5E5A" text-anchor="middle">Embedded C, Zephyr RTOS</text>

<!-- HPC-1 outer -->
<rect x="40" y="190" width="280" height="160" rx="16" fill="#ffffff" stroke="#888780" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="60" y="212" font-family="Arial" font-size="13" font-weight="700" fill="#141412">HPC-1 - Raspberry Pi 5</text>
<text x="60" y="228" font-family="Arial" font-size="10.5" fill="#6a6a63">Xen hypervisor (final choice over Jailhouse)</text>

<rect x="60" y="240" width="110" height="90" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="115" y="278" font-family="Arial" font-size="12.5" font-weight="700" fill="#26215C" text-anchor="middle">Dom0</text>
<text x="115" y="296" font-family="Arial" font-size="10.5" fill="#3C3489" text-anchor="middle">Linux, 1 core</text>

<rect x="190" y="240" width="110" height="90" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="245" y="278" font-family="Arial" font-size="12.5" font-weight="700" fill="#26215C" text-anchor="middle">QNX DomU</text>
<text x="245" y="296" font-family="Arial" font-size="10.5" fill="#3C3489" text-anchor="middle">3 cores</text>

<!-- HPC-2 outer -->
<rect x="360" y="190" width="280" height="160" rx="16" fill="#ffffff" stroke="#888780" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="380" y="212" font-family="Arial" font-size="13" font-weight="700" fill="#141412">HPC-2 - BeagleBone Black</text>
<text x="380" y="228" font-family="Arial" font-size="10.5" fill="#6a6a63">No hypervisor, no RTOS, single core</text>

<rect x="380" y="240" width="110" height="90" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="435" y="278" font-family="Arial" font-size="12.5" font-weight="700" fill="#26215C" text-anchor="middle">Yocto Linux</text>
<text x="435" y="296" font-family="Arial" font-size="10.5" fill="#3C3489" text-anchor="middle">Host OS</text>

<rect x="510" y="240" width="110" height="90" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="565" y="278" font-family="Arial" font-size="12.5" font-weight="700" fill="#26215C" text-anchor="middle">Docker</text>
<text x="565" y="296" font-family="Arial" font-size="10.5" fill="#3C3489" text-anchor="middle">Isolated containers</text>

<!-- Clouds -->
<rect x="55" y="390" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="180" y="424" font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle">AWS</text>

<rect x="375" y="390" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="500" y="424" font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle">Azure</text>
</svg>
